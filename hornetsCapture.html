<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hornets A team capture</title>
<style>
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#1c1c1e;color:#f2f2f2;font:15px -apple-system,system-ui,sans-serif;user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding:6px;min-height:600px}
button{font:inherit;color:#fff;border:0;border-radius:8px;background:#555;min-height:40px;padding:2px 4px;position:relative}
button:active{filter:brightness(1.3)}
.row{display:flex;gap:6px}.row>*{flex:1}
.sc{background:#2f6bf0;font-size:30px;font-weight:600;line-height:1;flex:0 0 78px}.sc small{display:block;font-size:12px;font-weight:400}
.sc.t{background:#e965e9}
.ent{flex:3;background:#2a2a2c;border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;font-size:14px}
.ent b{color:#ef9f3a}.ent i{color:#999;font-style:normal;font-size:12px}
.main{flex:1;display:grid;grid-template-columns:132px repeat(3,1fr) 200px;gap:6px;min-height:0}
.col{display:flex;flex-direction:column;gap:5px;min-height:0}.col>button{flex:1}.col>.sp{flex:1}button:disabled{opacity:.3}
h4{margin:0;font-size:13px;font-weight:600;color:#aaa}
.g{background:#3f9a2e}.o{background:#ef9f3a;color:#2a1a00}.pl{background:#2f6bf0}.pl small{font-size:11px;opacity:.7;margin-right:4px}
.srv::after{content:"";position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;background:#ff3b30}
.sel{outline:3px solid #fff}.pu{background:#8a1ff0}.th.srv{background:#c04fc0}
.fa{background:#e8452a}.tp{background:#e965e9}
.pn{background:#2a2a2c;border-radius:8px;padding:6px;font-size:13px;line-height:1.35}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.grid3 button{min-height:48px}
input,select{width:100%;min-width:0;font:inherit;padding:8px;border-radius:6px;border:1px solid #555;background:#111;color:#fff;-webkit-user-select:text;user-select:text}
.fld{display:flex;gap:6px;align-items:center;margin:6px 0}.fld>span{flex:0 0 100px}.zg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#setup{overflow:auto;flex:1;padding:4px}
#se,#sr,#md{display:none}.ta{width:100%;height:40vh;background:#111;color:#eee;border:1px solid #555;border-radius:6px;font-size:12px;-webkit-user-select:text;user-select:text}.stt{flex:0 0 auto}.fl2{flex-wrap:wrap}.fl2>*{flex:1 0 28%}.fld{flex-wrap:wrap}html,body{overflow-x:hidden}.tb td:first-child,.tb th:first-child{position:sticky;left:0;background:#2a2a2c}
#st{display:flex;flex-direction:column;gap:5px;flex:0 0 235px;min-height:0}#stb{overflow:auto;flex:1;background:#2a2a2c;border-radius:8px;padding:4px 6px}#st .row button{min-height:34px;font-size:13px}.tw{overflow-x:auto;margin-bottom:6px}.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{padding:4px 6px;text-align:right;border-bottom:1px solid #3a3a3c;white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left}.tb th{color:#aaa;font-weight:500}.tb tr.tot td{font-weight:600;border-top:2px solid #777}.tb tr.now td{background:#33405a}#srb{flex:4;flex-wrap:wrap}#srb>*{flex:1 0 18%}
#md{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9;align-items:center;justify-content:center}
#md>div{background:#2a2a2c;border-radius:12px;padding:14px;width:min(440px,92%)}
@media(max-width:900px){html,body{height:auto;overflow:auto}#app{height:auto;min-height:0}#top{flex-wrap:wrap}.ent{flex:1 0 100%;order:-1}.main{grid-template-columns:repeat(3,1fr);flex:none}.main .col{min-height:0}#us,#th{grid-column:1/-1}#us{flex-direction:row;flex-wrap:wrap}#us>button{flex:1 0 22%}#us>h4,#us>.row{flex:1 0 100%}#st{flex:none}#stb{overflow:visible}#st .stt{flex-wrap:wrap}#st .stt>button{flex:1 0 22%}.tb th,.tb td{padding:4px 4px;font-size:12px}#app.lf .main{grid-template-columns:92px repeat(3,1fr)}#app.lf #us{grid-column:auto;flex-direction:column;flex-wrap:nowrap}#app.lf #us>button{flex:1 1 auto;font-size:13px}#app.lf #us>h4,#app.lf #us>.row{flex:none}#app.lf #th{grid-column:1/-1}#app.lf .col>button{font-size:13px}.col>button{min-height:48px}}
</style></head><body><div id="app">
<div class="row" id="hd"></div>
<div id="setup" style="display:none"></div>
<div id="cap" style="flex:1;display:flex;flex-direction:column;gap:6px;min-height:0">
<div class="row" id="top"></div>
<div class="row" id="se" style="align-items:center"><span id="sel" style="flex:1.2"></span><div class="row" id="seb" style="flex:5"></div></div>
<div class="row" id="sr" style="align-items:center"><span id="srt" style="flex:1"></span><div class="row" id="srb"></div></div>
<div class="main">
<div class="col" id="us"></div>
<div class="col" id="c1"></div><div class="col" id="c2"></div><div class="col" id="c3"></div>
<div class="col" id="th"></div></div>
<div id="st"></div>
<div class="row" id="gm"></div></div></div>
<div id="ex" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10;align-items:center;justify-content:center"><div id="exc" style="background:#2a2a2c;border-radius:12px;padding:14px;width:min(560px,94%)"></div></div>
<div id="md"><div id="mdc"></div></div>
<script>
const NM={14:'jordyn',11:'addie',10:'ariana',5:'veronica',18:'micaela',7:'amelia',3:'ella'};
const ROST=[14,11,10,5,18,7,3];
const z=()=>({a:0,p:0,o:0,n:0});
const mk=()=>({us:0,them:0,srv:'us',ours:[0,0,0,0,0,0],their:[0,0,0,0,0,0],run:{us:z(),them:z()},last:{us:null,them:null},hist:[],log:[],rc:0,ev:[]});
var ui_lf=false;
var SAVED=null;
let games={1:mk(),2:mk(),3:mk()},G=1,S,tab='setup';
let M={team:'A team',opp:'',date:new Date().toISOString().slice(0,10),venue:'',g1:'us',g3:'',pairs:[],fmt:{games:3,to:25,to3:15,by2:true,cap:0}};
try{const s=JSON.parse(localStorage.getItem('hc3')||'null');if(s){games=s.games;G=s.G;M=s.M;SAVED=s;M.pairs=M.pairs||[];M.fmt=M.fmt||{games:3,to:25,to3:15,by2:true,cap:0};if(games[G].ev.length)tab='cap'}}catch(e){}
try{ui_lf=localStorage.getItem('hcl')==='1'}catch(e){}
S=games[G];
function applyServe(){[1,2,3].forEach(g=>{const x=games[g];if(!x.ev.length&&!x.us&&!x.them)x.srv=g===1?M.g1:g===2?(M.g1==='us'?'them':'us'):(M.g3||x.srv)})}
const GL=()=>M.fmt.games===2?[1,2]:[1,2,3];
function over(g){const x=games[g],t=g===3?M.fmt.to3:M.fmt.to,a=x.us,b=x.them,d=M.fmt.by2?2:1;if(M.fmt.cap&&Math.max(a,b)>=M.fmt.cap&&a!==b)return a>b?'us':'them';if(Math.max(a,b)>=t&&Math.abs(a-b)>=d)return a>b?'us':'them';return null}
function setToss(t){M.g3=t;applyServe();save();R()}
function lay(){ui.lf=!ui.lf;try{localStorage.setItem('hcl',ui.lf?'1':'0')}catch(e){}R()}
function subsFor(ours,srv){const m=[];M.pairs.forEach(p=>{if(!p.a||!p.b)return;const eA=z=>p.az.includes(z)&&(z!==1||srv==='us');[[p.a,p.b,z=>eA(z)],[p.b,p.a,z=>!eA(z)]].forEach(([x,y,ok])=>{const i=ours.indexOf(x);if(i>=0&&!ok(i+1)&&ours.indexOf(y)<0){ours[i]=y;m.push({in:y,out:x,z:i+1})}})});return m}
const subTxt=m=>m.map(x=>NM[x.in]+' in for '+NM[x.out]+' (Z'+x.z+')').join(' · ');
function autoSubs(){const m=subsFor(S.ours,S.srv);if(m.length){S.note=subTxt(m);S.noteAt=Date.now()}}
function subWatch(){if(!M.pairs.some(p=>p.a&&p.b))return null;const o=S.ours.slice(),res=[];let srv=S.srv,so=0;
 for(let i=1;i<=14&&res.length<2;i++){const side=srv==='them';if(side){o.push(o.shift());so++;srv='us'}else srv='them';const m=subsFor(o,srv);if(m.length)res.push({i,so,side,m})}return res}
const subWhen=r=>r.side?(r.so===1?'on our next side-out':`on our side-out #${r.so} from now`):(r.so===0?'when we lose serve':`when we lose serve after ${r.so} side-out${r.so>1?'s':''}`);
function fixSrv(t,i){if(!i)return;hp();S.note='';const f=i<=3?i:i-6;for(let x=0;x<Math.abs(f);x++)rot(t,f>0?1:-1);save();R()}
function fixStep(t,d){hp();S.note='';rot(t,d);save();R()}
function fixBench(n){hp();S.ours[0]=n;save();R()}
function fixNum(){const v=parseInt(document.getElementById('pkn').value)||0;hp();S.their[0]=v;save();R()}
function fixDone(){ui.pk=null;autoSubs();save();R()}
applyServe();
function goTab(t){tab=t;if(t==='setup')RSet();R()}
function hdr(){document.getElementById('hd').innerHTML=`<div class="ent" style="flex:4"><div><b>${M.team}</b> vs ${M.opp||'?'} · Game ${G} · ${M.venue||'?'} · ${M.date}</div></div><button class="${tab==='setup'?'sel':''}" style="flex:.6" onclick="goTab('setup')">Setup</button><button class="${tab==='cap'?'sel':''}" style="flex:.6" onclick="goTab('cap')">Capture</button><button style="flex:.6" onclick="lay()">Layout</button>`}
function setZ(i,v){v=+v;if(v){const j=S.ours.indexOf(v);if(j>=0)S.ours[j]=0}S.ours[i]=v;save();RSet()}
function tg(key,lab){const c=M[key];return `<div class="fld"><span style="flex:1">${lab}</span><button class="${c==='us'?'pl sel':''}" onclick="M.${key}='us';applyServe();save();RSet();hdr()">We serve</button><button class="${c==='them'?'tp sel':''}" onclick="M.${key}='them';applyServe();save();RSet();hdr()">They serve</button>${key==='g3'?`<button class="${c?'':'sel'}" onclick="M.g3='';save();RSet()">Decide later</button>`:''}</div>`}
function setPair(i,k,v){M.pairs[i][k]=+v;save();RSet()}
function togZ(i,z){const a=M.pairs[i].az,j=a.indexOf(z);j>=0?a.splice(j,1):a.push(z);a.sort();save();RSet()}
function pairUI(){return M.pairs.map((p,i)=>{const zs=[1,2,3,4,5,6],bz=zs.filter(z=>!p.az.includes(z)),
 sel=k=>`<select onchange="setPair(${i},'${k}',this.value)"><option value="0">-</option>${RS.map(n=>`<option value="${n}"${p[k]===n?' selected':''}>${n} ${NM[n]}</option>`).join('')}</select>`;
 return `<div class="pn" style="margin:6px 0"><div class="zg"><div><small>Player A</small>${sel('a')}</div><div><small>Player B (replaces A)</small>${sel('b')}</div><button style="align-self:end" onclick="M.pairs.splice(${i},1);save();RSet()">Remove</button></div>
 <div style="margin:6px 0"><small>Zones A plays:</small></div><div class="row">${zs.map(z=>`<button class="${p.az.includes(z)?'pl sel':''}" onclick="togZ(${i},${z})">Z${z}</button>`).join('')}</div>
 <div style="margin-top:6px"><b>${NM[p.a]||'A'}</b>: ${p.az.map(z=>'Z'+z+(z===1?' (serving)':'')).join(', ')||'none'}<br><b>${NM[p.b]||'B'}</b>: ${bz.map(z=>'Z'+z+(z===1?' (receiving)':'')).join(', ')||'none'}<br>Server: <b>${NM[p.az.includes(1)?p.a:p.b]||'?'}</b></div></div>`}).join('')}
const csv=r=>r.map(x=>{x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',');
const strip=gs=>{const o={};[1,2,3].forEach(g=>{o[g]={...gs[g],hist:[]}});return o};
function logCSV(m,gs){const rows=[['Game','Point','Score us-them','Serving team','Server #','Result','Action','Reason','Players','Fault by','Point to','Rotation']];
 [1,2,3].forEach(g=>{const x=gs[g];if(!x||!x.ev.length)return;let a=0,b=0;x.ev.forEach((e,i)=>{e.w==='us'?a++:b++;
  rows.push([g,i+1,a+'-'+b,e.sv,e.srvNum||'',e.t==='g'?'earned':'error',e.k,e.r||'',(e.who||[]).map(n=>NM[n]||n).join(' + '),e.t==='g'?(e.w==='us'?'':'us'):(e.w==='them'?'us':'them'),e.w,e.rn])})});
 return csv(['Match',m.team+' vs '+m.opp,m.date,m.venue])+'\n'+rows.map(csv).join('\n')}
function playerCSV(m,gs){const E=[1,2,3].flatMap(g=>gs[g]?gs[g].ev:[]),P=agg(E);
 const rows=[['Player','Serves','Aces','Serve errors','Points','Errors',...TY.map(k=>'Err: '+k)]];
 RS.forEach(n=>rows.push([NM[n],P[n].srv,P[n].ace,P[n].et.serve||0,P[n].pts,P[n].err,...TY.map(k=>P[n].et[k]||0)]));
 const sc=[1,2,3].filter(g=>gs[g]&&(gs[g].us||gs[g].them)).map(g=>'G'+g+' '+gs[g].us+'-'+gs[g].them).join('  ');
 return csv(['Match',m.team+' vs '+m.opp,m.date,m.venue,sc])+'\n'+rows.map(csv).join('\n')}
function showEx(kind,m,gs){m=m||M;gs=gs||games;
 const text=kind==='log'?logCSV(m,gs):kind==='pl'?playerCSV(m,gs):JSON.stringify({M:m,games:strip(gs)});
 const nm=(m.date||'match')+'_'+(m.opp||'opp').replace(/\W+/g,'-')+'_'+(kind==='json'?'backup.json':kind==='log'?'points.csv':'players.csv');
 window.EX={text,nm};
 document.getElementById('exc').innerHTML=`<div style="margin-bottom:6px"><b>${nm}</b></div><textarea id="ext" readonly class="ta"></textarea><div class="row" style="margin-top:8px"><button onclick="exCopy()">Copy</button><button class="g" onclick="exShare()">Share / save file</button><button onclick="exClose()">Close</button></div>`;
 document.getElementById('ext').value=text;document.getElementById('ex').style.display='flex'}
function exClose(){document.getElementById('ex').style.display='none'}
function exCopy(){const t=document.getElementById('ext');t.focus();t.select();try{t.setSelectionRange(0,1e8)}catch(e){}let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(EX.text)}
async function exShare(){const f=new File([EX.text],EX.nm,{type:EX.nm.endsWith('json')?'application/json':'text/csv'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=EX.nm;document.body.appendChild(a);a.click();a.remove()}
function showImport(){document.getElementById('exc').innerHTML=`<div style="margin-bottom:6px">Paste a backup (the text from Backup)</div><textarea id="ext" class="ta"></textarea><div class="row" style="margin-top:8px"><button class="g" onclick="doImport()">Save as saved match</button><button onclick="exClose()">Close</button></div>`;document.getElementById('ex').style.display='flex'}
function doImport(){try{const o=JSON.parse(document.getElementById('ext').value);if(!o.M||!o.games)throw 0;const a=hist();a.unshift({id:Date.now(),M:o.M,games:o.games});putHist(a);exClose();RSet()}catch(e){alert('That does not look like a backup.')}}
const hist=()=>{try{return JSON.parse(localStorage.getItem('hch')||'[]')}catch(e){return[]}};
function putHist(a){try{localStorage.setItem('hch',JSON.stringify(a))}catch(e){alert('Could not save match history (storage full). Export a backup first.')}}
function archiveNow(){if(![1,2,3].some(g=>games[g].ev.length))return false;const a=hist();a.unshift({id:Date.now(),M:JSON.parse(JSON.stringify(M)),games:strip(games)});putHist(a);return true}
function newMatch(){if(!confirm('Save this match to Saved matches and start a new, empty match?'))return;archiveNow();
 M={...M,opp:'',venue:'',date:new Date().toISOString().slice(0,10),g1:'us',g3:''};games={1:mk(),2:mk(),3:mk()};G=1;S=games[1];clr();ui.pk=null;applyServe();save();RSet();R()}
function openArch(i){const h=hist()[i];if(!h||!confirm('Open this saved match? The current match is saved to history first.'))return;
 archiveNow();const b=hist(),j=b.findIndex(x=>x.id===h.id);if(j>=0)b.splice(j,1);putHist(b);
 M=h.M;M.pairs=M.pairs||[];M.fmt=M.fmt||{games:3,to:25,to3:15,by2:true,cap:0};games=h.games;G=1;S=games[1];clr();ui.pk=null;save();RSet();R()}
function delArch(i){if(!confirm('Delete this saved match?'))return;const a=hist();a.splice(i,1);putHist(a);RSet()}
function exArch(i,k){const h=hist()[i];if(h)showEx(k,h.M,h.games)}
function histUI(){const a=hist();if(!a.length)return '<div style="color:#999">No saved matches yet</div>';
 return a.map((h,i)=>{const sc=[1,2,3].filter(g=>h.games[g]&&(h.games[g].us||h.games[g].them)).map(g=>h.games[g].us+'-'+h.games[g].them).join(', ');
  return `<div class="pn" style="margin:6px 0"><b>${h.M.date} vs ${h.M.opp||'?'}</b> ${h.M.venue||''}<br>Games: ${sc||'none'}<div class="row fl2" style="margin-top:6px"><button onclick="exArch(${i},'log')">Points CSV</button><button onclick="exArch(${i},'pl')">Players CSV</button><button onclick="exArch(${i},'json')">Backup</button><button onclick="openArch(${i})">Open</button><button onclick="delArch(${i})">Delete</button></div></div>`}).join('')}
function dismissNote(){S.note='';save();R()}
function RSet(){const o=S.srv==='us'?'We':'They';
 document.getElementById('setup').innerHTML=`<h4>Match</h4>
 <div class="fld"><span>Opponent</span><input value="${M.opp}" oninput="M.opp=this.value;save();hdr()"></div>
 <div class="fld"><span>Date</span><input type="date" value="${M.date}" oninput="M.date=this.value;save();hdr()"></div>
 <div class="fld"><span>Venue</span><input value="${M.venue}" oninput="M.venue=this.value;save();hdr()"></div>
 ${tg('g1','Game 1 first serve')}
 <div class="fld"><span style="flex:1">Game 2 first serve (automatic)</span><b>${M.g1==='us'?'They':'We'} serve</b></div>
 ${tg('g3','Game 3 coin toss (can wait until game 3 starts)')}
 <h4 style="margin-top:12px">Format</h4>
 <div class="fld"><span>Games</span>${[2,3].map(n=>`<button class="${M.fmt.games===n?'pl sel':''}" onclick="M.fmt.games=${n};save();RSet()">${n}</button>`).join('')}<span>Win by 2</span><button class="${M.fmt.by2?'g sel':''}" onclick="M.fmt.by2=!M.fmt.by2;save();RSet()">${M.fmt.by2?'Yes':'No'}</button></div>
 <div class="fld"><span>Play to</span><input type="number" inputmode="numeric" value="${M.fmt.to}" oninput="M.fmt.to=+this.value||25;save()"><span>Game 3 to</span><input type="number" inputmode="numeric" value="${M.fmt.to3}" oninput="M.fmt.to3=+this.value||15;save()"><span>Cap (0 none)</span><input type="number" inputmode="numeric" value="${M.fmt.cap||''}" oninput="M.fmt.cap=+this.value||0;save()"></div>
 <h4 style="margin-top:12px">Sub pairs</h4><div><small>Player A plays the zones you pick (Z1 only while serving) and Player B replaces A in the others. The app subs automatically.</small></div>${pairUI()}${M.pairs.length<2?`<button style="width:100%" onclick="M.pairs.push({a:0,b:0,az:[1,2,3,4]});save();RSet()">Add sub pair</button>`:''}
 <h4 style="margin-top:12px">Starting lineup for game ${G}</h4><div class="row" style="margin:6px 0">${GL().map(g=>`<button class="${g===G?'sel':''}" onclick="G=${g};S=games[G];RSet();hdr()">Game ${g}</button>`).join('')}</div>
 <div>${o} serve first in game ${G}. Z1 is back right (server).</div>
 <h4 style="margin-top:8px">Our players</h4><div class="zg">${[3,2,1,4,5,0].map(i=>`<div><small>Z${i+1}</small><select onchange="setZ(${i},this.value)"><option value="0">-</option>${RS.map(n=>{const u=S.ours.indexOf(n),used=u>=0&&u!==i;return `<option value="${n}"${S.ours[i]===n?' selected':''}${used?' style="color:#888"':''}>${n} ${NM[n]}${used?' · in Z'+(u+1):''}</option>`}).join('')}</select></div>`).join('')}</div>
 <h4 style="margin-top:8px">Their players (jersey numbers)</h4><div class="zg">${[3,2,1,4,5,0].map(i=>`<div><small>Z${i+1}</small><input type="number" inputmode="numeric" value="${S.their[i]||''}" oninput="S.their[${i}]=parseInt(this.value)||0;save()"></div>`).join('')}</div>
 <h4 style="margin-top:14px">This match: export or finish</h4><div class="row fl2"><button onclick="showEx('log')">Points CSV</button><button onclick="showEx('pl')">Players CSV</button><button onclick="showEx('json')">Backup</button></div>
 <button style="width:100%;margin-top:8px" onclick="newMatch()">Finish match &amp; start a new one</button>
 <h4 style="margin-top:14px">Saved matches</h4>${histUI()}<button style="width:100%" onclick="showImport()">Import a backup</button>
 <button class="g" style="width:100%;margin-top:12px;min-height:52px" onclick="goTab('cap')">Start capture</button>`}
const ui={lf:ui_lf,sel:[],pend:null,their:false,edit:null,pk:null,ed:false,skip:null};
if(SAVED&&SAVED.ui){ui.pend=SAVED.ui.pend||null;ui.sel=SAVED.ui.sel||[];ui.their=!!SAVED.ui.their}
const EARN=['ace','spike','tip','dump','down ball hit'];
